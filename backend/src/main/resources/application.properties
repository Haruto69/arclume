spring.application.name=arclume-api
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arclume}
spring.datasource.username=${DB_USERNAME:arclume}
spring.datasource.password=${DB_PASSWORD:arclume_local_password}

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=false
spring.flyway.baseline-on-migrate=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info

# CORS and Cookie Settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
app.security.jwt.cookie.samesite=${JWT_COOKIE_SAMESITE:Strict}
app.security.jwt.cookie.path=${JWT_COOKIE_PATH:/}

# AI Enrichment & Career Matching
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
app.ai.max-input-chars=${AI_MAX_INPUT_CHARS:8000}


