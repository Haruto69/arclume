spring.application.name=arclume-api
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arclume}
spring.datasource.username=${DB_USERNAME:arclume}
spring.datasource.password=${DB_PASSWORD:arclume_local_password}

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=false
spring.flyway.baseline-on-migrate=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Hardened authentication
app.security.auth.challenge-secret=${AUTH_CHALLENGE_SECRET:}
app.security.auth.encryption-key=${AUTH_ENCRYPTION_KEY:}
app.security.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.security.auth.cookie.samesite=${AUTH_COOKIE_SAMESITE:Strict}
app.security.auth.cookie.path=${AUTH_COOKIE_PATH:/}
app.security.auth.session-days=${AUTH_SESSION_DAYS:30}
app.security.auth.challenge-minutes=${AUTH_CHALLENGE_MINUTES:10}
app.security.auth.verification-hours=${AUTH_VERIFICATION_HOURS:24}
app.security.auth.resend-cooldown-seconds=${AUTH_RESEND_COOLDOWN_SECONDS:60}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.email.delivery=${EMAIL_DELIVERY:disabled}

# AI Enrichment & Career Matching
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
app.ai.max-input-chars=${AI_MAX_INPUT_CHARS:8000}


