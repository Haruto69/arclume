spring.application.name=arclume-api
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arclume}
spring.datasource.username=${DB_USERNAME:arclume}
spring.datasource.password=${DB_PASSWORD:arclume_local_password}

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=false
spring.flyway.baseline-on-migrate=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Hardened authentication
app.security.auth.challenge-secret=${AUTH_CHALLENGE_SECRET:}
app.security.auth.encryption-key=${AUTH_ENCRYPTION_KEY:}
app.security.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.security.auth.cookie.samesite=${AUTH_COOKIE_SAMESITE:Strict}
app.security.auth.cookie.path=${AUTH_COOKIE_PATH:/}
app.security.auth.session-days=${AUTH_SESSION_DAYS:30}
app.security.auth.challenge-minutes=${AUTH_CHALLENGE_MINUTES:10}
app.security.auth.verification-hours=${AUTH_VERIFICATION_HOURS:24}
app.security.auth.resend-cooldown-seconds=${AUTH_RESEND_COOLDOWN_SECONDS:60}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.email.delivery=${EMAIL_DELIVERY:disabled}

# AI Enrichment & Career Matching
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
app.ai.max-input-chars=${AI_MAX_INPUT_CHARS:8000}
# Opportunity provider ingestion
# Providers remain disabled until explicitly activated; credentials or URLs alone do not enable sync.
app.opportunity.providers.remotive.enabled=${REMOTIVE_PROVIDER_ENABLED:false}
app.opportunity.providers.remotive.api-url=${REMOTIVE_API_URL:https://remotive.com/api/remote-jobs}
app.opportunity.providers.remotive.connection-timeout=${REMOTIVE_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.remotive.read-timeout=${REMOTIVE_READ_TIMEOUT:5s}
app.opportunity.providers.jobicy.enabled=${JOBICY_PROVIDER_ENABLED:false}
app.opportunity.providers.jobicy.api-url=${JOBICY_API_URL:https://jobicy.com/api/v2/remote-jobs}
app.opportunity.providers.jobicy.count=${JOBICY_COUNT:50}
app.opportunity.providers.jobicy.connection-timeout=${JOBICY_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.jobicy.read-timeout=${JOBICY_READ_TIMEOUT:5s}
app.opportunity.providers.greenhouse.enabled=${GREENHOUSE_PROVIDER_ENABLED:false}
app.opportunity.providers.greenhouse.api-url=${GREENHOUSE_API_URL:https://boards-api.greenhouse.io/v1/boards}
app.opportunity.providers.greenhouse.connection-timeout=${GREENHOUSE_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.greenhouse.read-timeout=${GREENHOUSE_READ_TIMEOUT:5s}
app.opportunity.providers.lever.enabled=${LEVER_PROVIDER_ENABLED:false}
app.opportunity.providers.lever.global-api-url=${LEVER_GLOBAL_API_URL:https://api.lever.co/v0/postings}
app.opportunity.providers.lever.eu-api-url=${LEVER_EU_API_URL:https://api.eu.lever.co/v0/postings}
app.opportunity.providers.lever.page-size=${LEVER_PAGE_SIZE:100}
app.opportunity.providers.lever.max-pages=${LEVER_MAX_PAGES:20}
app.opportunity.providers.lever.connection-timeout=${LEVER_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.lever.read-timeout=${LEVER_READ_TIMEOUT:5s}
app.opportunity.providers.codeforces.enabled=${CODEFORCES_PROVIDER_ENABLED:false}
app.opportunity.providers.codeforces.api-url=${CODEFORCES_API_URL:https://codeforces.com/api}
app.opportunity.providers.codeforces.past-retention-days=${CODEFORCES_PAST_RETENTION_DAYS:14}
app.opportunity.providers.codeforces.connection-timeout=${CODEFORCES_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.codeforces.read-timeout=${CODEFORCES_READ_TIMEOUT:5s}
app.opportunity.providers.the-muse.enabled=${THE_MUSE_PROVIDER_ENABLED:false}
app.opportunity.providers.the-muse.api-url=${THE_MUSE_API_URL:https://www.themuse.com/api/public}
app.opportunity.providers.the-muse.api-key=${THE_MUSE_API_KEY:}
app.opportunity.providers.the-muse.max-pages=${THE_MUSE_MAX_PAGES:10}
app.opportunity.providers.the-muse.connection-timeout=${THE_MUSE_CONNECTION_TIMEOUT:5s}
app.opportunity.providers.the-muse.read-timeout=${THE_MUSE_READ_TIMEOUT:5s}
